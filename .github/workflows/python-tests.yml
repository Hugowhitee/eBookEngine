name: Python regression tests

on:
  push:
    branches:
      - feat/libron-epub-embedding
    paths:
      - ebookengine/**
      - tests/**
      - pyproject.toml
      - .github/workflows/python-tests.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run Python regressions
        run: python -m pytest -q
      - name: Generate repaired EPUB 2 sample
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, "tests")
          from test_navigation import epub2
          from ebookengine.core import EpubSource, ChangeSession
          temp = Path("/tmp/ebookengine-validation")
          temp.mkdir(exist_ok=True)
          original = epub2(temp)
          candidate = ChangeSession(EpubSource(original)).build()
          (temp / "repaired.epub").write_bytes(candidate)
          PY
      - name: Validate generated EPUB with EPUBCheck 5.4.0
        run: |
          curl --fail --location --silent --show-error --retry 2             --output /tmp/epubcheck.zip             https://github.com/w3c/epubcheck/releases/download/v5.4.0/epubcheck-5.4.0.zip
          unzip -q /tmp/epubcheck.zip -d /tmp/epubcheck
          jar_path="$(find /tmp/epubcheck -name epubcheck.jar -print -quit)"
          test -n "$jar_path"
          java -jar "$jar_path" /tmp/ebookengine-validation/repaired.epub
